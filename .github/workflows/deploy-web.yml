name: Deploy web (staging platform)

# Builds the browser version of The Bold Life Coach platform (the member app, no
# Electron) and publishes it to GitHub Pages. This is the STAGING / acceptance URL
# the client reviews before we point a production domain at it for BLC. Live-video
# peering needs a provider in production; the staged build shows the full UI, the
# recorded-curriculum player, and local camera preview.
on:
  push:
    branches: [main]
    paths:
      - 'src/renderer/**'
      - 'vite.config.web.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Write .env (public client config from repo variables)
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_AGENT_URL=${{ vars.VITE_AGENT_URL }}
          VITE_EMAIL_FUNCTION_URL=${{ vars.VITE_EMAIL_FUNCTION_URL }}
          EOF
      - name: Build web (staging)
        run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
